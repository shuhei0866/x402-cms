# Tracked X (Twitter) handles for the weekly digest.
#
# The real file `config/tracked_handles.yaml` is gitignored — it's a
# curation choice, not OSS surface. This `.example.yaml` ships in the
# repo so a fresh clone has a working template that resolves against
# the live X API.
#
# Format: a flat YAML list of X handles (NOT GitHub handles). Entries
# may include or omit the leading '@'; the indexer strips it. Blank
# lines and YAML comments are ignored.
#
# X API quirk: an unknown handle returns HTTP 200 with an `errors`
# body, not 404. The indexer classifies both as HandleNotFoundError
# and skips the entry, so a typo here does not abort the run.

- x402_org    # x402 protocol official account
- base        # Coinbase Base L2 official
- CoinbaseDev # Coinbase Developer Platform
