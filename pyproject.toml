[project]
name = "x402-cms"
version = "0.1.0"
description = "x402-paid CMS — Agent-oriented content delivery with HTTP 402 micropayments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "shuhei0866" }]
keywords = ["x402", "cms", "agent", "payment", "402", "agentic-commerce"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "x402[fastapi,httpx,evm]>=2.9.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "google-cloud-firestore>=2.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "pre-commit>=3.7.0",
    "anthropic>=0.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["code"]

[tool.ruff]
line-length = 100
